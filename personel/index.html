<!DOCTYPE html>
<html lang="tr" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <!-- Chrome/Edge'in "Bu sayfayı çevirmek ister misiniz?" balonunu tamamen
       kapatır. lang="tr" özniteliği tek başına yeterli olmuyor çünkü Chrome
       çeviri teklifini sayfadaki metnin kendi istatistiksel dil analizine göre
       tetikliyor; sayfada "PIN", "Excel", "WhatsApp", "JSON" gibi İngilizce
       kelimeler/kısaltmalar yoğun olduğundan sayfayı yanlışlıkla İngilizce
       sanabiliyor. Bu meta etiketi ve html'deki translate="no" birlikte, dil
       algısından bağımsız olarak çeviri teklifini kesin olarak devre dışı bırakır. -->
  <meta name="google" content="notranslate">
  <title>Tim Bilgileri</title>
  <link rel="stylesheet" href="style.css">

  <style>
    /* Dark mod: mevcut style.css ve satır içi stillerin ardından uygulanır. */
    /* ÖNEMLİ: Buton BİLEREK "position: fixed" DEĞİL. Ekranda sabit kalıp sayfa
       kaydırıldığında hep görünür kalmasın diye normal sayfa akışı içinde,
       Ayarlar bölümünde sabit bir NOKTADA duruyor. Sayfa kaydırıldığında diğer
       içerikler gibi yukarı/aşağı kayar, ekran dışına çıkabilir. */
    #themeToggle {
      width: 30px;
      height: 30px;
      border: 1px solid #d1d5db;
      border-radius: 30%;
      background: #ffffff;
      color: #111827;
      box-shadow: 0 6px 18px rgba(0, 0, 0, .18);
      cursor: pointer;
      font-size: 14px;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      flex-shrink: 0;
    }

    html.dark {
      color-scheme: dark;
    }

    /* ÖNEMLİ DÜZELTME: Sayfanın <meta name="color-scheme" content="light dark">
       etiketi tarayıcıya "ikisini de destekliyorum" dediği için, aşağıdaki kural
       olmadan tarayıcı native form kontrollerinin (select açılır listesi,
       tarih/ay seçici takvimi, kaydırma çubuğu vb.) rengini CİHAZIN işletim
       sistemi tercihine göre seçiyordu — kullanıcı uygulama içinde "Aydınlık"
       temayı seçmiş olsa BİLE, cihaz işletim sistemi karanlık modaysa bu native
       bileşenler karanlık renklerle çiziliyordu. Sonuç: örn. tarih seçici
       takviminin ok/simge rengi veya select açılır listesinin metni, üzerine
       bindiği zorla-beyaz arka planla (aşağıdaki "AYDINLIK MOD INPUT
       ZORLAMASI" kuralı) neredeyse aynı renkte kalıp OKUNAMAZ hale geliyordu.
       Bu satır, uygulama "Aydınlık" temadayken tüm native bileşenlerin de
       gerçekten aydınlık şemayla çizilmesini garanti eder. */
    html:not(.dark) {
      color-scheme: light;
    }

    html.dark body,
    html.dark .app-container {
      background: #0f172a !important;
      color: #e5e7eb !important;
    }

    html.dark .card,
    html.dark .card-body,
    html.dark .view-section,
    html.dark .action-bar,
    html.dark .select-all-bar,
    html.dark .birthday-panel,
    html.dark .personel-list > li,
    html.dark #kategoriListesi > *,
    html.dark #formContainer > *,
    html.dark #sablonListesiContainer > * {
      background-color: #111827 !important;
      color: #e5e7eb !important;
      border-color: #334155 !important;
    }

    html.dark .card-header {
      background-color: #172033 !important;
      color: #f8fafc !important;
      border-color: #334155 !important;
    }

    html.dark h1,
    html.dark h2,
    html.dark h3,
    html.dark h4,
    html.dark h5,
    html.dark h6,
    html.dark label,
    html.dark span,
    html.dark p,
    html.dark #headerTitle,
    html.dark #bilgiNotuAlani {
      color: #e5e7eb !important;
    }

    html.dark input:not([type="checkbox"]):not([type="radio"]),
    html.dark textarea,
    html.dark select {
      background: #1e293b !important;
      color: #f8fafc !important;
      border-color: #475569 !important;
    }

    html.dark input::placeholder,
    html.dark textarea::placeholder {
      color: #94a3b8 !important;
    }

    html.dark button:not(.btn-add):not(.btn-delete):not(.btn-location) {
      border-color: #475569;
    }

    html.dark .btn-header,
    html.dark button[style*="background: none"] {
      color: #f8fafc !important;
    }

    html.dark hr,
    html.dark [style*="border-top: 1px solid #eee"],
    html.dark [style*="border-bottom: 1px solid #eee"] {
      border-color: #334155 !important;
    }

    html.dark #customPromptModal > div {
      background: #111827 !important;
      color: #e5e7eb !important;
      border: 1px solid #334155;
    }

    html.dark #customPromptTitle {
      color: #f8fafc !important;
    }

    html.dark #customPromptCancel {
      background: #475569 !important;
      color: #f8fafc !important;
    }

    html.dark #customConfirmModal > div {
      background: #111827 !important;
      color: #e5e7eb !important;
      border: 1px solid #334155;
    }

    html.dark #customConfirmMessage {
      color: #e5e7eb !important;
    }

    html.dark #customConfirmCancel {
      background: #475569 !important;
      color: #f8fafc !important;
    }

    html.dark #themeToggle {
      background: #1e293b;
      color: #f8fafc;
      border-color: #475569;
    }
    /* Şablon listesi (Ayarlar sayfası) - Dark Mode */
html.dark #sablonListesiContainer > div {
  background: #1e293b !important;
  border-color: #334155 !important;
  color: #e5e7eb !important;
}

html.dark #sablonListesiContainer span[style*="background:#e0e0e0"],
html.dark #sablonListesiContainer span[style*="background: #e0e0e0"] {
  background: #334155 !important;
  border-color: #475569 !important;
  color: #e5e7eb !important;
}

html.dark #sablonListesiContainer [style*="color: #1e88e5"],
html.dark #sablonListesiContainer [style*="color:#1e88e5"] {
  color: #60a5fa !important;
}

html.dark #sablonListesiContainer [style*="border-top: 1px dashed #ddd"],
html.dark #sablonListesiContainer [style*="border-top:1px dashed #ddd"] {
  border-top-color: #475569 !important;
}

html.dark #sablonListesiContainer [style*="color:#999"],
html.dark #sablonListesiContainer [style*="color: #999"],
html.dark #sablonListesiContainer [style*="color:#888"] {
  color: #94a3b8 !important;
}
/* Grup / Tim Yönetimi kutuları ve personel atama listesi - Dark Mode */
html.dark #grupTimListesiContainer > div,
html.dark #ataPersonelListesi {
  background: #1e293b !important;
  border-color: #334155 !important;
  color: #e5e7eb !important;
}

html.dark #grupTimListesiContainer [style*="color:#999"],
html.dark #grupTimListesiContainer [style*="color: #999"] {
  color: #94a3b8 !important;
}

html.dark #grupTimListesiContainer [style*="border-top:1px dashed #ddd"],
html.dark #grupTimListesiContainer [style*="border-top: 1px dashed #ddd"] {
  border-top-color: #475569 !important;
}

html.dark #ataPersonelListesi label {
  border-bottom-color: #334155 !important;
}

/* Anasayfa personel listesindeki Grup/Tim rozeti - Dark Mode
   (Genel "span { color: #e5e7eb }" kuralı, rozetin kendi mavi metnini
   ezip açık mavi zemin üzerinde okunaksız bırakıyordu; burada rozete özel
   koyu zemin + açık mavi metin rengi veriliyor.) */
html.dark .grup-tim-etiketi {
  background: #0c4a6e !important;
  color: #7dd3fc !important;
}

/* Anasayfa aramasında şablon içeriğinden eşleşen alan etiketi
   ("Ad: Değer" rozeti) ve Nöbet istatistik panelindeki "Toplam" rozeti
   - Dark Mode (aynı açık mavi rozet ikisinde de kullanılıyor) */
html.dark .arama-eslesme-etiketi {
  background: #0c4a6e !important;
  color: #7dd3fc !important;
}

/* "Daha Fazla Göster" butonları (Anasayfa listesi ve Ayarlar > Personel Ata
   listesi) - Dark Mode */
html.dark .daha-fazla-goster-btn {
  background: #1e293b !important;
  color: #60a5fa !important;
  border-color: #334155 !important;
}

/* Doluluk Oranı raporundaki ilerleme çubuğunun (boş) arka planı - Dark Mode */
html.dark .dolum-cubugu-track {
  background: #334155 !important;
}
/* ========== AYDINLIK MOD INPUT ZORLAMASI ========== */
html:not(.dark) input:not([type="checkbox"]):not([type="radio"]):not([type="file"]),
html:not(.dark) textarea,
html:not(.dark) select {
  background-color: #ffffff !important;
  color: #1a1f36 !important;
  border-color: #e5e7eb !important;
}

html:not(.dark) input::placeholder,
html:not(.dark) textarea::placeholder {
  color: #9ca3af !important;
}

/* Theme toggle butonu aydınlık modda */
html:not(.dark) #themeToggle {
  background: #ffffff !important;
  color: #111827 !important;
  border-color: #d1d5db !important;
}

/* ========== CHECKBOX AYDINLIK MOD DÜZELTMESİ ========== */
html:not(.dark) input[type="checkbox"] {
  accent-color: #1e88e5;
  color-scheme: light;           /* Önemli */
  background-color: #ffffff;
}

html:not(.dark) .personel-item input[type="checkbox"],
html:not(.dark) .select-all-bar input[type="checkbox"] {
  accent-color: #1e88e5 !important;
  color-scheme: light !important;
}

/* Karanlık modda da düzgün dursun */
html.dark input[type="checkbox"] {
  accent-color: #60a5fa;
  color-scheme: dark;
}

/* ========== DİNAMİK MODALLAR (Dark Mode) ========== */
html.dark div[style*="background: white"],
html.dark div[style*="background:white"],
html.dark div[style*="background:#fff"],
html.dark div[style*="background: #fff"],
html.dark div[style*="background:#fafafa"],
html.dark div[style*="background: #fafafa"],
html.dark div[style*="background:#f9f9f9"],
html.dark div[style*="background: #f9f9f9"],
html.dark div[style*="background:#f8f9fa"],
html.dark div[style*="background: #f8f9fa"] {
  background: #1e293b !important;
  color: #e5e7eb !important;
  border: 1px solid #334155 !important;
}

/* ONEMLI DUZELTME: Oncesinde sadece <p> ve <h3> etiketlerinin rengi degistiriliyordu.
   Ancak dinamik olusturulan pop-up pencerelerin cogu metnini <span>, <div>, <b>,
   <small>, <label> gibi etiketlerle ve koyu/gri renk kodlariyla (orn. color:#333,
   #666, #888) yaziyor. Arka plan koyu moda gecip metin rengi degismeyince yazilar
   koyu zemin uzerinde koyu renkte kalip OKUNAMAZ hale geliyordu. Kural artik TUM
   alt ogeleri kapsiyor; renkli rozet/basliklar kendi arka planlariyla yine de
   yeterli kontrastta gorunmeye devam eder. */
html.dark div[style*="background: white"] *,
html.dark div[style*="background:white"] *,
html.dark div[style*="background:#fff"] *,
html.dark div[style*="background: #fff"] *,
html.dark div[style*="background:#fafafa"] *,
html.dark div[style*="background: #fafafa"] *,
html.dark div[style*="background:#f9f9f9"] *,
html.dark div[style*="background: #f9f9f9"] *,
html.dark div[style*="background:#f8f9fa"] *,
html.dark div[style*="background: #f8f9fa"] * {
  color: #e5e7eb !important;
}

html.dark div[style*="background: white"] input,
html.dark div[style*="background:white"] input,
html.dark div[style*="background: white"] select,
html.dark div[style*="background:white"] select,
html.dark div[style*="background: white"] textarea,
html.dark div[style*="background:white"] textarea {
  background: #0f172a !important;
  color: #f1f5f9 !important;
  border-color: #475569 !important;
}

/* ÖNEMLİ DÜZELTME: "Bildirim açık" / "PIN aktif" yazılarındaki yeşil vurgu rengi,
   aydınlık modda BEYAZ zemin üzerinde okunaklı olacak şekilde koyu bir yeşile
   (#15803d) ayarlandı (bkz. script.js / ayarlar.js). Ancak bu kutular
   var(--input-bg) kullanıyor ve "DİNAMİK MODALLAR" kuralının hedeflediği
   inline "background:white" deseniyle eşleşmiyor; yani karanlık modda kutunun
   zemini KOYU LACİVERTE (#0f172a) dönüyor ama yazı rengi hâlâ aydınlık moda
   göre ayarlanmış koyu yeşilde kalıyordu (koyu zemin + koyu yeşil = okunamaz).
   Bu yüzden karanlık mod için burada ayrıca daha AÇIK bir yeşil tanımlanıyor. */
html.dark #bildirimDurumYazisi b,
html.dark #pinDurumYazisi b {
  color: #4ade80 !important;
}

  </style>

  <script>
(() => {
  // Sadece kullanıcı daha önce açıkça dark seçtiyse dark açılsın.
  // localStorage'da 'theme' yoksa veya 'light' ise aydınlık açılsın.
  if (localStorage.getItem('theme') === 'dark') {
    document.documentElement.classList.add('dark');
  }
})();
  </script>

  <!-- SheetJS CDN -->
  <script src="./xlsx.full.min.js"></script>
  <script>
    if (typeof XLSX === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"><\/script>');
    }
  </script>
</head>
<body>

  <script src="script.js"></script>
  <!-- Özel Prompt Modal -->
<div id="customPromptModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; align-items:center; justify-content:center;">
  <div style="background:#fff; padding:20px; border-radius:8px; width:90%; max-width:400px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
    <h3 id="customPromptTitle" style="margin-top:0; font-size:16px; color:#333;">Şablon Girişi</h3>
    <input type="text" id="customPromptInput" style="width:100%; padding:10px; margin:15px 0; border:1px solid #ccc; border-radius:4px; box-sizing:border-box; font-size:14px;" placeholder="Şablon değerini girin...">
    <div style="text-align:right;">
      <button id="customPromptCancel" style="padding:8px 15px; margin-right:10px; background:#ccc; border:none; border-radius:4px; cursor:pointer;">İptal</button>
      <button id="customPromptOk" style="padding:8px 15px; background:#007bff; color:#fff; border:none; border-radius:4px; cursor:pointer;">Tamam</button>
    </div>
  </div>
</div>

<!-- Özel Onay (Confirm) Modal -->
<div id="customConfirmModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; align-items:center; justify-content:center;">
  <div style="background:#fff; padding:20px; border-radius:8px; width:90%; max-width:380px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
    <p id="customConfirmMessage" style="margin-top:0; font-size:14px; color:#333; line-height:1.4; white-space:pre-wrap;"></p>
    <div style="text-align:right; margin-top:15px;">
      <button id="customConfirmCancel" style="padding:8px 15px; margin-right:10px; background:#ccc; border:none; border-radius:4px; cursor:pointer;">İptal</button>
      <button id="customConfirmOk" style="padding:8px 15px; background:#e53935; color:#fff; border:none; border-radius:4px; cursor:pointer; font-weight:bold;">Evet, Sil</button>
    </div>
  </div>
</div>


<!-- Koyu/Açık Tema Butonu: Ayarlar bölümü içinde, sayfa akışında sabit bir noktada
     duruyor (bkz. #themeToggle CSS notu). Ekranda hep görünen "yüzen" bir buton
     DEĞİL; Ayarlar sayfası kaydırıldığında diğer içerikle birlikte kayar. -->

  <div class="app-container">
    <div class="card">

      <!-- BAŞLIK KARTI (ID Eklendi) -->
      <div class="card-header" id="cardHeader">
        <!-- Sol: Geri Butonu -->
        <button class="btn-header btn-back" id="btnBack" onclick="solButonTiklandi()" style="visibility: hidden;">
          ‹
        </button>

        <!-- Ortadaki Başlık -->
        <div class="header-container">
          <h1 id="headerTitle" style="font-size: 20px; margin: 0;">Personel Listesi</h1>
          <div id="bilgiNotuAlani" style="font-size: 14px; margin-top: 4px; color: #666; text-align: center;"></div>
        </div>

        <!-- Sağ: Ayarlar Butonu -->
        <button class="btn-header btn-settings" id="btnSettings" onclick="ayarlarSayfasinaGit()">
          ⚙
        </button>
      </div>

      <div class="card-body">

        <!-- ANA SAYFA -->
        <div id="viewMain" class="view-section">

          <div id="birthdayPanelContainer" class="birthday-panel" style="display: none;">
            <h4>🎉 Yaklaşan / Bugünkü Özel Günler</h4>
            <ul class="birthday-list" id="birthdayListContent"></ul>
          </div>

          <input type="text" class="search-box" id="searchInput" placeholder="Personel Ara..." oninput="personelAra()">

          <div class="action-bar">
            <div class="action-row">
              <button class="btn btn-add" onclick="yeniPersonelEkle()">Ekle</button>
              <button class="btn btn-delete" onclick="secilileriSil()">Sil</button>
              <button class="btn btn-location" onclick="whatsappKonumIste()">Konum</button>
              <button class="btn" onclick="nobetPaneliAc()" style="background:#ec4899">Nöbet</button>
              <button class="btn" onclick="zimmetTakipPaneliAc()" style="background:#8b5cf6">Zimmet</button>
            </div>

            <input type="file" id="excelInput" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" style="display:none" onchange="importExcel(event)">
            <input type="file" id="jsonInput" accept=".txt,application/json,.json" style="display:none" onchange="jsonDosyasiniIceriAl(event)" />
          </div>

          <div class="select-all-bar">
            <label>
              <input type="checkbox" id="selectAllCheckbox" onchange="hepsiniSecToggle(this)">
              <span>Hepsini Seç</span>
              <span style="color:#1e88e5; font-size:12px; font-weight:bold;">(<span id="seciliSayisi">0</span> seçili)</span>
            </label>
            <span style="color: #6b7280; font-size: 13px;" id="toplamPersonelSayisi">Toplam: 0 Kişi</span>
          </div>

          <div style="display:flex; align-items:center; justify-content:flex-end; gap:6px; margin: 8px 0 10px;">
            <label for="siralamaSecici" style="font-size:12px; color:#6b7280;">Sırala:</label>
            <select id="siralamaSecici" onchange="siralamaDegisti(this.value)" style="padding:6px 8px; border:1px solid #d1d5db; border-radius:8px; font-size:12px; background:white; color:#374151;">
              <option value="sicil">Sicil No</option>
              <option value="ad_az">İsim (A-Z)</option>
              <option value="ad_za">İsim (Z-A)</option>
              <option value="grup">Grup / Tim</option>
              <option value="son_eklenen">Son Eklenen</option>
            </select>
          </div>

          <ul class="personel-list" id="personelListesi"></ul>
        </div>

        <!-- KATEGORİLER -->
        <div id="viewCategories" class="view-section" style="display: none;">
          <div id="kategoriListesi"></div>
        </div>

        <!-- FORM -->
        <div id="viewForm" class="view-section" style="display: none;">
          <div id="formContainer"></div>
          <button onclick="verileriKaydet()" style="background: #10b981; color: white; border: none; padding: 14px; border-radius: 14px; font-size: 15px; font-weight: 600; width: 100%; margin-top: 8px; cursor: pointer; box-shadow: 0 4px 12px rgba(16,185,129,0.25);">
            Formu Kaydet
          </button>
        </div>

        <!-- AYARLAR SAYFASI -->
        <div id="viewAyarlar" class="view-section" style="display: none;">
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 16px; border-bottom: 1px solid #eee; padding-bottom: 12px;">
            <div style="display: flex; align-items: center; gap: 10px;">
              <button onclick="anaSayfayaDon()" style="background: none; color: #1a1f36; border: none; padding: 4px 8px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 18px;">⬅️</button>
              <h3 style="margin: 0; font-size: 18px; color: #1a1f36;">Ayarlar</h3>
            </div>
            <button id="themeToggle" type="button" aria-label="Koyu temayı aç" title="Tema değiştir">🌙</button>
          </div>

          <!-- Sekme Butonları -->
          <div class="ayarlar-sekme-bar">
            <button id="sekmeBtnSablon" class="ayarlar-sekme-btn aktif" onclick="ayarlarSekmeGoster('sablon')">📂 Şablon</button>
            <button id="sekmeBtnGrupTim" class="ayarlar-sekme-btn" onclick="ayarlarSekmeGoster('gruptim')">👥 Grup / Tim</button>
            <button id="sekmeBtnVeri" class="ayarlar-sekme-btn" onclick="ayarlarSekmeGoster('veri')">⚠️ Veri</button>
          </div>

          <!-- ŞABLON SEKMESİ -->
          <div id="ayarlarSekmeSablon" class="ayarlar-sekme-icerik">
            <!-- Yeni Ana Kategori Ekle -->
            <div style="margin-bottom: 20px;">
              <label style="font-size: 13px; font-weight: 600; color: #4b5563;">Yeni Ana Kategori Ekle:</label>
              <div style="display: flex; gap: 8px; margin-top: 6px;">
                <input type="text" id="yeniAnaKategoriInput" placeholder="Örn: Aile Bilgileri" style="flex: 1; padding: 10px; border: 1px solid #e5e7eb; border-radius: 10px;">
                <button onclick="anaKategoriEkle()" style="background: #1e88e5; color: white; border: none; padding: 10px 14px; border-radius: 10px; font-weight: 600; cursor: pointer;">Ekle</button>
              </div>
            </div>

            <!-- Yeni Alt Kategori Ekle -->
            <div style="margin-bottom: 20px;">
              <label style="font-size: 13px; font-weight: 600; color: #4b5563;">Yeni Alt Kategori Ekle:</label>
              <select id="anaKategoriSecici" style="width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 10px; margin-top: 6px; margin-bottom: 6px;"></select>
              <div style="display: flex; gap: 8px;">
                <input type="text" id="yeniAltKategoriInput" placeholder="Örn: Eş / Çocuk" style="flex: 1; padding: 10px; border: 1px solid #e5e7eb; border-radius: 10px;">
                <button onclick="altKategoriEkle()" style="background: #10b981; color: white; border: none; padding: 10px 14px; border-radius: 10px; font-weight: 600; cursor: pointer;">Ekle</button>
              </div>
            </div>

            <!-- Mevcut Şablon Yapısı -->
            <div style="border-top: 1px solid #eee; padding-top: 15px;">
              <label style="font-size: 13px; font-weight: 600; color: #4b5563;">Mevcut Şablon Yapısı ve Alanlar:</label>
              <div id="sablonListesiContainer" style="margin-top: 8px; font-size: 13px;"></div>
            </div>
          </div>

          <!-- GRUP / TİM SEKMESİ -->
          <div id="ayarlarSekmeGrupTim" class="ayarlar-sekme-icerik" style="display: none;">
            <div style="margin-bottom: 20px;">
              <label style="font-size: 13px; font-weight: 600; color: #4b5563;">Anasayfa Açılır Menüsü İçin Grup / Tim Listesi:</label>

              <!-- Yeni Grup Ekle -->
              <div style="display: flex; gap: 8px; margin-top: 10px;">
                <input type="text" id="yeniGrupInput" placeholder="Örn: 1. Grup" style="flex: 1; padding: 10px; border: 1px solid #e5e7eb; border-radius: 10px;">
                <button onclick="grupEkle()" style="background: #1e88e5; color: white; border: none; padding: 10px 14px; border-radius: 10px; font-weight: 600; cursor: pointer;">Grup Ekle</button>
              </div>

              <!-- Yeni Tim Ekle -->
              <select id="grupSeciciTimIcin" style="width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 10px; margin-top: 10px; margin-bottom: 6px;"></select>
              <div style="display: flex; gap: 8px;">
                <input type="text" id="yeniTimInput" placeholder="Örn: 1. Tim" style="flex: 1; padding: 10px; border: 1px solid #e5e7eb; border-radius: 10px;">
                <button onclick="timEkle()" style="background: #10b981; color: white; border: none; padding: 10px 14px; border-radius: 10px; font-weight: 600; cursor: pointer;">Tim Ekle</button>
              </div>

              <!-- Mevcut Grup / Tim Listesi -->
              <div id="grupTimListesiContainer" style="margin-top: 12px; font-size: 13px;"></div>
            </div>

            <!-- Personeli Grup / Tim'e Ata -->
            <div style="border-top: 1px dashed #ddd; padding-top: 14px;">
              <label style="font-size: 13px; font-weight: 600; color: #4b5563;">Personeli Grup / Tim'e Ata (Birden Fazla Seçilebilir):</label>
              <input type="text" id="ataPersonelAramaInput" placeholder="Personel ara..." oninput="ataPersonelListesiniCiz()" style="width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 10px; margin-top: 8px; box-sizing: border-box;">
              <div id="ataPersonelListesi" style="max-height: 190px; overflow-y: auto; border: 1px solid #e5e7eb; border-radius: 10px; margin-top: 6px; padding: 6px;"></div>
              <div style="font-size: 11px; color: #666; margin-top: 4px;"><span id="ataSeciliSayisi">0</span> personel seçili</div>
              <select id="ataGrupSecici" onchange="ataTimSeciciDoldur()" style="width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 10px; margin-top: 10px;"></select>
              <select id="ataTimSecici" style="width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 10px; margin-top: 8px;"></select>
              <div style="display:flex; gap:8px; margin-top: 10px;">
                <button onclick="personeleGrupTimAta()" style="flex:1; background: #0284c7; color: white; border: none; padding: 10px 14px; border-radius: 10px; font-weight: 600; cursor: pointer;">Seçilenleri Ata</button>
                <button onclick="personelAtamasiniKaldir()" style="flex:1; background: #6b7280; color: white; border: none; padding: 10px 14px; border-radius: 10px; font-weight: 600; cursor: pointer;">Atamayı Kaldır</button>
              </div>
            </div>
          </div>

          <!-- VERİ SEKMESİ -->
          <div id="ayarlarSekmeVeri" class="ayarlar-sekme-icerik" style="display: none;">
            <label style="font-size: 13px; font-weight: 600; color: #374151;">Bildirimler:</label>
            <div class="ayarlar-kutu">
              <div id="bildirimDurumYazisi" class="ayarlar-kutu-durum"></div>
              <button id="bildirimToggleBtn" onclick="bildirimIzniIsteVeAc()" style="background:#0284c7; color:white; border:none; padding:10px 14px; border-radius:10px; font-weight:600; cursor:pointer; width:100%; font-size:13px;">🔔 Doğum Günü Bildirimlerini Aç</button>
            </div>

            <label style="font-size: 13px; font-weight: 600; color: #374151; display:block; margin-top: 20px;">Güvenlik (PIN Kilidi):</label>
            <div class="ayarlar-kutu">
              <div id="pinDurumYazisi" class="ayarlar-kutu-durum"></div>
              <div style="display:flex; gap:8px;">
                <button id="pinBelirleBtn" onclick="pinBelirle()" style="flex:1; background:#7c3aed; color:white; border:none; padding:10px 14px; border-radius:10px; font-weight:600; cursor:pointer; font-size:13px;">PIN Belirle</button>
                <button id="pinKaldirBtn" onclick="pinKaldir()" style="display:none; flex:1; background:#6b7280; color:white; border:none; padding:10px 14px; border-radius:10px; font-weight:600; cursor:pointer; font-size:13px;">PIN Kaldır</button>
              </div>
            </div>

            <label style="font-size: 13px; font-weight: 600; color: #374151; display:block; margin-top: 20px;">Yedekleme ve Veri Aktarımı:</label>
            <div style="display:flex; flex-direction:column; gap:10px; margin-top: 8px;">
              <button onclick="jsonVeritabaninaKaydet()" style="background:#10b981; color:white; border:none; padding:12px; border-radius:10px; font-weight:600; cursor:pointer; text-align:left; display:flex; align-items:center; gap:8px; font-size:13px;">
                💾 Cihaz Hafızasına Kaydet
              </button>
              <button onclick="yedekOlustur()" style="background:#43a047; color:white; border:none; padding:12px; border-radius:10px; font-weight:600; cursor:pointer; text-align:left; display:flex; align-items:center; gap:8px; font-size:13px;">
                🗄️ Tam Yedek Al (JSON)
              </button>
              <button onclick="dosyaSeciciAc()" style="background:#673ab7; color:white; border:none; padding:12px; border-radius:10px; font-weight:600; cursor:pointer; text-align:left; display:flex; align-items:center; gap:8px; font-size:13px;">
                ♻️ Yedekten Geri Yükle (JSON)
              </button>
              <button onclick="exportExcel()" style="background:#2e7d32; color:white; border:none; padding:12px; border-radius:10px; font-weight:600; cursor:pointer; text-align:left; display:flex; align-items:center; gap:8px; font-size:13px;">
                📊 Seçilileri Excel'e Aktar (xlsx)
              </button>
              <button onclick="document.getElementById('excelInput').click();" style="background:#3f51b5; color:white; border:none; padding:12px; border-radius:10px; font-weight:600; cursor:pointer; text-align:left; display:flex; align-items:center; gap:8px; font-size:13px;">
                📥 Excel'den İçeri Al (xlsx)
              </button>
            </div>

            <label style="font-size: 13px; font-weight: 600; color: #dc2626; display:block; margin-top: 20px;">Veri Yönetimi:</label>
            <div style="margin-top: 6px;">
              <button onclick="tumVerileriSifirla()" style="background: #dc2626; color: white; border: none; padding: 12px 14px; border-radius: 10px; font-weight: 600; cursor: pointer; width: 100%; font-size: 14px;">⚠️ Tüm Verileri ve Ayarları Sıfırla</button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  

  <script>
    (() => {
      const root = document.documentElement;
      const button = document.getElementById('themeToggle');

      function updateButton() {
        const isDark = root.classList.contains('dark');
        button.textContent = isDark ? '☀️' : '🌙';
        button.setAttribute('aria-label', isDark ? 'Açık temayı aç' : 'Koyu temayı aç');
        button.setAttribute('aria-pressed', String(isDark));
      }

      button.addEventListener('click', () => {
        root.classList.toggle('dark');
        localStorage.setItem('theme', root.classList.contains('dark') ? 'dark' : 'light');
        updateButton();
      });

      updateButton();
    })();
  </script>
</body>
</html>
