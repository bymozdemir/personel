<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Tim Bilgileri</title>
  <link rel="stylesheet" href="style.css">

  <style>
    /* Dark mod: mevcut style.css ve satır içi stillerin ardından uygulanır. */
    #themeToggle {
      position: fixed;
      right: 16px;
      bottom: calc(16px + env(safe-area-inset-bottom));
      z-index: 10000;
      width: 46px;
      height: 46px;
      border: 1px solid #d1d5db;
      border-radius: 50%;
      background: #ffffff;
      color: #111827;
      box-shadow: 0 6px 18px rgba(0, 0, 0, .18);
      cursor: pointer;
      font-size: 21px;
    }

    html.dark {
      color-scheme: dark;
    }

    html.dark body,
    html.dark .app-container {
      background: #0f172a !important;
      color: #e5e7eb !important;
    }

    html.dark .card,
    html.dark .card-body,
    html.dark .view-section,
    html.dark .action-bar,
    html.dark .select-all-bar,
    html.dark .birthday-panel,
    html.dark .personel-list > li,
    html.dark #kategoriListesi > *,
    html.dark #formContainer > *,
    html.dark #sablonListesiContainer > * {
      background-color: #111827 !important;
      color: #e5e7eb !important;
      border-color: #334155 !important;
    }

    html.dark .card-header {
      background-color: #172033 !important;
      color: #f8fafc !important;
      border-color: #334155 !important;
    }

    html.dark h1,
    html.dark h2,
    html.dark h3,
    html.dark h4,
    html.dark h5,
    html.dark h6,
    html.dark label,
    html.dark span,
    html.dark p,
    html.dark #headerTitle,
    html.dark #bilgiNotuAlani {
      color: #e5e7eb !important;
    }

    html.dark input:not([type="checkbox"]):not([type="radio"]),
    html.dark textarea,
    html.dark select {
      background: #1e293b !important;
      color: #f8fafc !important;
      border-color: #475569 !important;
    }

    html.dark input::placeholder,
    html.dark textarea::placeholder {
      color: #94a3b8 !important;
    }

    html.dark button:not(.btn-add):not(.btn-delete):not(.btn-location) {
      border-color: #475569;
    }

    html.dark .btn-header,
    html.dark button[style*="background: none"] {
      color: #f8fafc !important;
    }

    html.dark hr,
    html.dark [style*="border-top: 1px solid #eee"],
    html.dark [style*="border-bottom: 1px solid #eee"] {
      border-color: #334155 !important;
    }

    html.dark #customPromptModal > div {
      background: #111827 !important;
      color: #e5e7eb !important;
      border: 1px solid #334155;
    }

    html.dark #customPromptTitle {
      color: #f8fafc !important;
    }

    html.dark #customPromptCancel {
      background: #475569 !important;
      color: #f8fafc !important;
    }

    html.dark #themeToggle {
      background: #1e293b;
      color: #f8fafc;
      border-color: #475569;
    }
    /* Şablon listesi (Ayarlar sayfası) - Dark Mode */
html.dark #sablonListesiContainer > div {
  background: #1e293b !important;
  border-color: #334155 !important;
  color: #e5e7eb !important;
}

html.dark #sablonListesiContainer span[style*="background:#e0e0e0"],
html.dark #sablonListesiContainer span[style*="background: #e0e0e0"] {
  background: #334155 !important;
  border-color: #475569 !important;
  color: #e5e7eb !important;
}

html.dark #sablonListesiContainer [style*="color: #1e88e5"],
html.dark #sablonListesiContainer [style*="color:#1e88e5"] {
  color: #60a5fa !important;
}

html.dark #sablonListesiContainer [style*="border-top: 1px dashed #ddd"],
html.dark #sablonListesiContainer [style*="border-top:1px dashed #ddd"] {
  border-top-color: #475569 !important;
}

html.dark #sablonListesiContainer [style*="color:#999"],
html.dark #sablonListesiContainer [style*="color: #999"],
html.dark #sablonListesiContainer [style*="color:#888"] {
  color: #94a3b8 !important;
}
/* ========== AYDINLIK MOD INPUT ZORLAMASI ========== */
html:not(.dark) input:not([type="checkbox"]):not([type="radio"]):not([type="file"]),
html:not(.dark) textarea,
html:not(.dark) select {
  background-color: #ffffff !important;
  color: #1a1f36 !important;
  border-color: #e5e7eb !important;
}

html:not(.dark) input::placeholder,
html:not(.dark) textarea::placeholder {
  color: #9ca3af !important;
}

/* Theme toggle butonu aydınlık modda */
html:not(.dark) #themeToggle {
  background: #ffffff !important;
  color: #111827 !important;
  border-color: #d1d5db !important;
}

/* ========== CHECKBOX AYDINLIK MOD DÜZELTMESİ ========== */
html:not(.dark) input[type="checkbox"] {
  accent-color: #1e88e5;
  color-scheme: light;           /* Önemli */
  background-color: #ffffff;
}

html:not(.dark) .personel-item input[type="checkbox"],
html:not(.dark) .select-all-bar input[type="checkbox"] {
  accent-color: #1e88e5 !important;
  color-scheme: light !important;
}

/* Karanlık modda da düzgün dursun */
html.dark input[type="checkbox"] {
  accent-color: #60a5fa;
  color-scheme: dark;
}

/* ========== DİNAMİK MODALLAR (Dark Mode) ========== */
html.dark div[style*="background: white"],
html.dark div[style*="background:white"],
html.dark div[style*="background:#fff"],
html.dark div[style*="background: #fff"] {
  background: #1e293b !important;
  color: #e5e7eb !important;
  border: 1px solid #334155 !important;
}

html.dark div[style*="background: white"] p,
html.dark div[style*="background:white"] p,
html.dark div[style*="background: white"] h3,
html.dark div[style*="background:white"] h3 {
  color: #e5e7eb !important;
}

html.dark div[style*="background: white"] input,
html.dark div[style*="background:white"] input,
html.dark div[style*="background: white"] select,
html.dark div[style*="background:white"] select,
html.dark div[style*="background: white"] textarea,
html.dark div[style*="background:white"] textarea {
  background: #0f172a !important;
  color: #f1f5f9 !important;
  border-color: #475569 !important;
}

  </style>

  <script>
(() => {
  // Sadece kullanıcı daha önce açıkça dark seçtiyse dark açılsın.
  // localStorage'da 'theme' yoksa veya 'light' ise aydınlık açılsın.
  if (localStorage.getItem('theme') === 'dark') {
    document.documentElement.classList.add('dark');
  }
})();
  </script>

  <!-- SheetJS CDN -->
  <script src="./xlsx.full.min.js"></script>
  <script>
    if (typeof XLSX === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"><\/script>');
    }
  </script>
</head>
<body>

  <script src="script.js"></script>
  <!-- Özel Prompt Modal -->
<div id="customPromptModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; align-items:center; justify-content:center;">
  <div style="background:#fff; padding:20px; border-radius:8px; width:90%; max-width:400px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
    <h3 id="customPromptTitle" style="margin-top:0; font-size:16px; color:#333;">Şablon Girişi</h3>
    <input type="text" id="customPromptInput" style="width:100%; padding:10px; margin:15px 0; border:1px solid #ccc; border-radius:4px; box-sizing:border-box; font-size:14px;" placeholder="Şablon değerini girin...">
    <div style="text-align:right;">
      <button id="customPromptCancel" style="padding:8px 15px; margin-right:10px; background:#ccc; border:none; border-radius:4px; cursor:pointer;">İptal</button>
      <button id="customPromptOk" style="padding:8px 15px; background:#007bff; color:#fff; border:none; border-radius:4px; cursor:pointer;">Tamam</button>
    </div>
  </div>
</div>


  <div class="app-container">
    <div class="card">

      <!-- BAŞLIK KARTI (ID Eklendi) -->
      <div class="card-header" id="cardHeader">
        <!-- Sol: Geri Butonu -->
        <button class="btn-header btn-back" id="btnBack" onclick="solButonTiklandi()" style="visibility: hidden;">
          ‹
        </button>

        <!-- Ortadaki Başlık -->
        <div class="header-container">
          <h1 id="headerTitle" style="font-size: 20px; margin: 0;">Personel Listesi</h1>
          <div id="bilgiNotuAlani" style="font-size: 14px; margin-top: 4px; color: #666; text-align: center;"></div>
        </div>

        <!-- Sağ: Ayarlar Butonu -->
        <button class="btn-header btn-settings" id="btnSettings" onclick="ayarlarSayfasinaGit()">
          ⚙
        </button>
      </div>

      <div class="card-body">

        <!-- ANA SAYFA -->
        <div id="viewMain" class="view-section">

          <div id="birthdayPanelContainer" class="birthday-panel" style="display: none;">
            <h4>🎉 Yaklaşan / Bugünkü Özel Günler</h4>
            <ul class="birthday-list" id="birthdayListContent"></ul>
          </div>

          <input type="text" class="search-box" id="searchInput" placeholder="Personel Ara..." oninput="personelAra()">

          <div class="action-bar">
            <div class="action-row">
              <button class="btn btn-add" onclick="yeniPersonelEkle()">Ekle</button>
              <button class="btn btn-delete" onclick="secilileriSil()">Sil</button>
              <button class="btn btn-location" onclick="whatsappKonumIste()">Konum</button>
              <button class="btn" onclick="nobetPaneliAc()" style="background:#ec4899">Nöbet</button>
              <button class="btn" onclick="veriYonetimiMenuAc()" style="background:#8b5cf6">Veri</button>
            </div>

            <input type="file" id="excelInput" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" style="display:none" onchange="importExcel(event)">
            <input type="file" id="jsonInput" accept=".txt,application/json,.json" style="display:none" onchange="jsonDosyasiniIceriAl(event)" />
          </div>

          <div class="select-all-bar">
            <label>
              <input type="checkbox" id="selectAllCheckbox" onchange="hepsiniSecToggle(this)">
              <span>Hepsini Seç</span>
            </label>
            <span style="color: #6b7280; font-size: 13px;" id="toplamPersonelSayisi">Toplam: 0 Kişi</span>
          </div>

          <ul class="personel-list" id="personelListesi"></ul>
        </div>

        <!-- KATEGORİLER -->
        <div id="viewCategories" class="view-section" style="display: none;">
          <div id="kategoriListesi"></div>
        </div>

        <!-- FORM -->
        <div id="viewForm" class="view-section" style="display: none;">
          <div id="formContainer"></div>
          <button onclick="verileriKaydet()" style="background: #10b981; color: white; border: none; padding: 14px; border-radius: 14px; font-size: 15px; font-weight: 600; width: 100%; margin-top: 8px; cursor: pointer; box-shadow: 0 4px 12px rgba(16,185,129,0.25);">
            Formu Kaydet
          </button>
        </div>

        <!-- AYARLAR SAYFASI -->
        <div id="viewAyarlar" class="view-section" style="display: none;">
          <div style="display: flex; justify-content: flex-start; align-items: center; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 12px;">
            <button onclick="anaSayfayaDon()" style="background: none; color: #1a1f36; border: none; padding: 4px 8px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 16px;">⬅️</button>
            <button id="themeToggle" type="button" aria-label="Koyu temayı aç" title="Tema değiştir">🌙</button>
            <h3 style="margin: 0; font-size: 18px; color: #1a1f36;">Şablon / Menü Ayarları</h3>
          </div>

          <!-- Yeni Ana Kategori Ekle -->
          <div style="margin-bottom: 20px;">
            <label style="font-size: 13px; font-weight: 600; color: #4b5563;">Yeni Ana Kategori Ekle:</label>
            <div style="display: flex; gap: 8px; margin-top: 6px;">
              <input type="text" id="yeniAnaKategoriInput" placeholder="Örn: Aile Bilgileri" style="flex: 1; padding: 10px; border: 1px solid #e5e7eb; border-radius: 10px;">
              <button onclick="anaKategoriEkle()" style="background: #1e88e5; color: white; border: none; padding: 10px 14px; border-radius: 10px; font-weight: 600; cursor: pointer;">Ekle</button>
            </div>
          </div>

          <!-- Yeni Alt Kategori Ekle -->
          <div style="margin-bottom: 20px;">
            <label style="font-size: 13px; font-weight: 600; color: #4b5563;">Yeni Alt Kategori Ekle:</label>
            <select id="anaKategoriSecici" style="width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 10px; margin-top: 6px; margin-bottom: 6px;"></select>
            <div style="display: flex; gap: 8px;">
              <input type="text" id="yeniAltKategoriInput" placeholder="Örn: Eş / Çocuk" style="flex: 1; padding: 10px; border: 1px solid #e5e7eb; border-radius: 10px;">
              <button onclick="altKategoriEkle()" style="background: #10b981; color: white; border: none; padding: 10px 14px; border-radius: 10px; font-weight: 600; cursor: pointer;">Ekle</button>
            </div>
          </div>

          <!-- Anasayfa Bilgi Notu -->
          <div style="margin-bottom: 20px; border-top: 1px solid #eee; padding-top: 15px;">
            <label style="font-size: 13px; font-weight: 600; color: #4b5563;">Anasayfa Bilgi Notu:</label>
            <div style="display: flex; gap: 8px; margin-top: 6px;">
              <input type="text" id="bilgiNotuInput" placeholder="Grup / Tim Bilgisi" style="flex: 1; padding: 10px; border: 1px solid #e5e7eb; border-radius: 10px;">
              <button onclick="bilgiNotunuKaydet()" style="background: #0284c7; color: white; border: none; padding: 10px 14px; border-radius: 10px; font-weight: 600; cursor: pointer;">Kaydet</button>
            </div>
          </div>

          <!-- Mevcut Şablon Yapısı -->
          <div style="border-top: 1px solid #eee; padding-top: 15px; margin-bottom: 20px;">
            <label style="font-size: 13px; font-weight: 600; color: #4b5563;">Mevcut Şablon Yapısı ve Alanlar:</label>
            <div id="sablonListesiContainer" style="margin-top: 8px; font-size: 13px;"></div>
            
            <!-- Tüm Verileri Sıfırla -->
            <div style="border-top: 1px solid #eee; padding-top: 15px; margin-bottom: 20px; margin-top: 15px;">
              <label style="font-size: 13px; font-weight: 600; color: #dc2626;">Veri Yönetimi:</label>
              <div style="margin-top: 6px;">
                <button onclick="tumVerileriSifirla()" style="background: #dc2626; color: white; border: none; padding: 12px 14px; border-radius: 10px; font-weight: 600; cursor: pointer; width: 100%; font-size: 14px;">⚠️ Tüm Verileri ve Ayarları Sıfırla</button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  

  <script>
    (() => {
      const root = document.documentElement;
      const button = document.getElementById('themeToggle');

      function updateButton() {
        const isDark = root.classList.contains('dark');
        button.textContent = isDark ? '☀️' : '🌙';
        button.setAttribute('aria-label', isDark ? 'Açık temayı aç' : 'Koyu temayı aç');
        button.setAttribute('aria-pressed', String(isDark));
      }

      button.addEventListener('click', () => {
        root.classList.toggle('dark');
        localStorage.setItem('theme', root.classList.contains('dark') ? 'dark' : 'light');
        updateButton();
      });

      updateButton();
    })();
  </script>
</body>
</html>
